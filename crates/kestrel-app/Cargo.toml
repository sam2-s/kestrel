[package]
name = "kestrel-app"
description = "The Kestrel Android app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "kestrel_app"
crate-type = ["cdylib", "rlib"]

[dependencies]
# egui on the host too, so the drawing code is testable without an Android build. It is
# the same version eframe uses.
egui = { version = "0.36", default-features = false }
kestrel-core.workspace = true
kestrel-net.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6"
eframe = { version = "0.36", default-features = false, features = ["glow", "android-native-activity", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "0.14", default-features = false }
rqrr = "0.11"
jni = "0.22"
log = "0.4"
ndk-context = "0.1"
android_logger = "0.13"

[features]
# Compiles the app for the host, so the map, the projection and the screens can be
# tested without an emulator. Never enabled for a release build.
host-preview = []
