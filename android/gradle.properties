# Kestrel's build settings.
#
# Most of the defaults are fine; the ones that are set here are the ones where the
# default would produce a bigger, slower or more permissive app than intended.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The Rust build is the slow part and it does not need the daemon's heap.
android.useAndroidX=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false

# A release APK is stripped and shrunk hard: the target is under 12 MB, and
# symbols are not shipped to a user who cannot use them.
android.enableR8.fullMode=true