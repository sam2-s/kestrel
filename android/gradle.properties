# Kestrel's build settings.
#
# Most of the defaults are fine; the ones that are set here are the ones where the
# default would produce a bigger, slower or more permissive app than intended.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# No AndroidX anywhere in this app: the shim is six Java files and the UI is Rust.
android.useAndroidX=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
# R8's optimised resource shrinking needs non-final resource IDs. It is on by default
# from AGP 9; set explicitly so the reason is here rather than in a build failure.
android.nonFinalResIds=true

# A release APK is stripped and shrunk hard: the target is under 12 MB, and
# symbols are not shipped to a user who cannot use them.
android.enableR8.fullMode=true