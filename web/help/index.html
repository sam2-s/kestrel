<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Emergency location</title>
    <link rel="stylesheet" href="/help/help.css" />
  </head>
  <body>
    <main id="app" class="app">
      <!-- Filled in by help.js. Everything below is the no-script state, which
           is a real state rather than a placeholder: a helper on a locked phone
           with JavaScript disabled should be told what happened, not shown a
           blank page. -->
      <noscript>
        <div class="panel">
          <h1>This page needs JavaScript</h1>
          <p>
            The emergency link decrypts on your device, and that needs JavaScript.
            Nothing about you has been sent anywhere: the page reads the link from
            the address bar and decrypts it here.
          </p>
        </div>
      </noscript>
    </main>
    <script src="/help/help.js"></script>
  </body>
</html>
